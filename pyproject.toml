[project]
name = "redsentinel"
version = "0.1.0"
description = "Autonomous pre-deployment security audit and hardening agent for enterprise AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "python-dotenv>=1",
  "matplotlib>=3.7",
]

[project.scripts]
redsentinel = "redsentinel.cli:main"
redsentinel-agent = "redsentinel.apps.evaluation_cli:main"
redsentinel-defense = "redsentinel.apps.defense_cli:main"
redsentinel-openmanus = "redsentinel.apps.openmanus_cli:openmanus_cli_boundary"
redsentinel-competition-matrix = "redsentinel.apps.competition_matrix_cli:cli_boundary"

[project.optional-dependencies]
evaluation = [
  "jsonschema>=4",
  "httpx>=0.27",
]
product = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  # JWT HS256 signing/verification uses Python stdlib HMAC in product_api.auth_service.
  # No third-party JWT package is required for the current product implementation.
]
defense = [
  "langchain",
  "langchain-chroma>=1.1",
  "langchain-core",
  "langchain-huggingface>=1.2",
  "langchain-openai",
  "langchain-text-splitters",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "chromadb",
  "sentence-transformers",
  "rank_bm25",
  "streamlit",
  "json-repair",
  "cryptography",
]
attack = [
  "reportlab",
  "pymupdf",
  "pypdf",
  "numpy",
  "Pillow",
]
dev = [
  "pytest",
  "ruff",
  "httpx2>=2.12",
  "jsonschema>=4",
  "tomli>=2; python_version<'3.11'",
]
all = [
  "redsentinel[attack,defense,evaluation,product,dev]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
  "third_party/OpenManus/upstream",
]

[tool.ruff.lint]
ignore = [
  "E401",
  "E501",
  "E701",
  "E702",
  "E712",
  "E741",
  "E402",
  "F401",
  "F403",
  "F405",
  "F541",
  "F841",
]

[tool.pytest.ini_options]
addopts = "-m fast"
testpaths = [
  "tests",
  "frontend/tests",
  "experiments/tests",
]
pythonpath = [
  "src",
]
markers = [
  "fast: deterministic offline tests used by the default suite",
  "docker: tests that require a reachable Docker daemon or real container execution",
  "external_model: tests that require network access or external model credentials",
  "research_full: extended offline research experiments excluded from quick feedback when explicitly requested",
  "unit: isolated tests for one function, class, or module",
  "contract: schema, protocol, compatibility, and architecture boundary tests",
  "integration: cross-module tests without external infrastructure",
  "research: experiment, baseline, ablation, statistics, and provenance tests",
  "regression: legacy behavior and user-facing workflow regression tests",
]
