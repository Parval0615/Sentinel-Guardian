openapi: 3.1.0
info:
  title: Agent Security Product API
  version: 0.1.0
  description: Image-backed Agent profiling, source onboarding compatibility, and Sentinel-managed sandbox audit API.
servers:
  - url: http://localhost:8000
paths:
  /v1/agents/onboard:
    post:
      summary: Onboard Agent source for sandbox audit
      operationId: onboardAgentSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentOnboardingRequest"
      responses:
        "200":
          description: Verified source material and sandbox build plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentOnboardingResponse"
  /v1/agents:
    post:
      summary: Register a platform-managed compatibility Agent
      description: Deprecated compatibility registration. Desktop image assets are discovered from RED_SENTINEL_AGENT_ROOT; source-only integrations use /v1/agents/onboard.
      deprecated: true
      operationId: registerAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegistration"
      responses:
        "200":
          description: Registered agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegistration"
  /v1/agents/index-errors:
    get:
      summary: List isolated Agent directory indexing errors
      operationId: listAgentIndexErrors
      responses:
        "200":
          description: Index errors for invalid directories; valid Agents remain available
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /v1/agents/{agent_id}/profile:
    get:
      summary: Get the latest image profile, with legacy source profile fallback
      operationId: getAgentProfile
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Published Agent profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageAgentProfile"
  /v1/agents/{agent_id}/profiles:
    post:
      summary: Queue or reuse an image-digest-bound profile analysis
      description: Static stages require neither Docker nor AI. Missing semantic or dynamic facilities may produce a partial published profile.
      operationId: createImageProfile
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "202":
          description: Queued, running, cached, or completed profile analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageProfileCreation"
  /v1/agents/{agent_id}/profiles/latest:
    get:
      summary: Get the latest published agent-profile-v0.2
      operationId: getLatestImageProfile
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Evidence-bound image profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageAgentProfile"
  /v1/agents/{agent_id}/profiles/{profile_id}:
    get:
      summary: Get an immutable image profile version
      operationId: getImageProfile
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence-bound image profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageAgentProfile"
  /v1/agents/{agent_id}/profiles/{analysis_id}/status:
    get:
      summary: Get eight-stage image profile status
      operationId: getImageProfileStatus
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: analysis_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stage status, timestamps, checkpoints, and errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageAnalysisStatus"
  /v1/agents/{agent_id}/profiles/{analysis_id}/retry:
    post:
      summary: Retry an image profile from its first failed stage
      operationId: retryImageProfile
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - name: analysis_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Reset analysis status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageAnalysisStatus"
  /v1/agents/{agent_id}/sessions:
    post:
      summary: Create an evaluation session
      operationId: createSession
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
            default: private_tenant
      responses:
        "200":
          description: Session metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageProfileCreation"
                required: [session_id, tenant_id, agent_id]
                properties:
                  session_id:
                    type: string
                  tenant_id:
                    type: string
                  agent_id:
                    type: string
  /v1/evaluations:
    post:
      summary: Run an evaluation
      operationId: createEvaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationRequest"
      responses:
        "200":
          description: Evaluation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationStatus"
  /v1/evaluations/{evaluation_id}:
    get:
      summary: Get evaluation status
      operationId: getEvaluation
      parameters:
        - name: evaluation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evaluation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationStatus"
  /v1/reports/{report_id}:
    get:
      summary: Get an agent security report
      operationId: getReport
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent security report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSecurityReport"
  /v1/comparisons:
    post:
      summary: Compare two completed reports
      operationId: compareReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before_report_id, after_report_id]
              properties:
                before_report_id:
                  type: string
                after_report_id:
                  type: string
      responses:
        "200":
          description: Retest comparison report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSecurityComparisonReport"
  /v1/trajectories:
    post:
      summary: Upload an offline trajectory
      operationId: uploadTrajectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, trajectory]
              properties:
                tenant_id:
                  type: string
                  default: private_tenant
                agent_id:
                  type: string
                trajectory:
                  type: object
      responses:
        "200":
          description: Uploaded trajectory reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageProfileCreation"
                required: [trajectory_id, path]
                properties:
                  trajectory_id:
                    type: string
                  path:
                    type: string
  /v1/audits:
    get:
      summary: List audits for the authenticated tenant
      operationId: listAudits
      responses:
        "200":
          description: Tenant audit list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditRun"
    post:
      summary: Create and optionally execute an autonomous security audit
      operationId: createAudit
      parameters:
        - name: background
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: prepare_only
          in: query
          required: false
          description: Build the attack plan and stop for explicit user review.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditTask"
      responses:
        "200":
          description: Persisted audit run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRun"
  /v1/audits/{audit_id}:
    get:
      summary: Get an audit run
      operationId: getAudit
      parameters:
        - $ref: "#/components/parameters/AuditId"
      responses:
        "200":
          description: Persisted audit run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRun"
  /v1/audits/{audit_id}/plan:
    get:
      summary: Get the validated audit plan
      operationId: getAuditPlan
      parameters:
        - $ref: "#/components/parameters/AuditId"
      responses:
        "200":
          description: Audit plan view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPlanView"
  /v1/audits/{audit_id}/execute:
    post:
      summary: Approve a reviewed attack plan and start formal execution
      operationId: executeAudit
      parameters:
        - $ref: "#/components/parameters/AuditId"
        - name: background
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Audit accepted for execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRun"
  /v1/audits/{audit_id}/status:
    get:
      summary: Get audit stage progress
      operationId: getAuditStatus
      parameters:
        - $ref: "#/components/parameters/AuditId"
      responses:
        "200":
          description: Audit status view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStatusView"
  /v1/audits/{audit_id}/evidence:
    get:
      summary: Get the refreshed audit evidence index
      operationId: getAuditEvidence
      parameters:
        - $ref: "#/components/parameters/AuditId"
      responses:
        "200":
          description: Evidence availability and hashes
          content:
            application/json:
              schema:
                type: object
  /v1/audits/{audit_id}/decision:
    get:
      summary: Get the four-state release decision
      operationId: getAuditDecision
      parameters:
        - $ref: "#/components/parameters/AuditId"
      responses:
        "200":
          description: Release decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDecision"
  /v1/audits/{audit_id}/workspace:
    get:
      summary: Get the C5 audit workspace aggregate
      operationId: getAuditWorkspace
      parameters:
        - $ref: "#/components/parameters/AuditId"
      responses:
        "200":
          description: Audit workspace aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditWorkspaceView"
  /v1/audits/{audit_id}/resume:
    post:
      summary: Resume a non-terminal audit
      operationId: resumeAudit
      parameters:
        - $ref: "#/components/parameters/AuditId"
        - name: background
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Updated audit run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRun"
  /v1/audits/{audit_id}/next-round:
    post:
      summary: Generate a feedback-driven attack set and start the next audit round
      operationId: createNextAuditRound
      parameters:
        - $ref: "#/components/parameters/AuditId"
        - name: background
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: prepare_only
          in: query
          required: false
          description: Generate the feedback-driven plan and stop for review.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Newly created audit round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRun"
  /v1/runtime/openmanus/status:
    get:
      summary: Check whether the current App process can run OpenManus
      operationId: getOpenManusRuntimeStatus
      responses:
        "200":
          description: Runtime configuration status without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenManusRuntimeStatus"
  /v1/runtime/openmanus/config:
    post:
      summary: Configure ephemeral OpenManus model credentials
      operationId: configureOpenManusRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenManusRuntimeConfiguration"
      responses:
        "200":
          description: Runtime configuration status without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenManusRuntimeStatus"
  /v1/runtime/models/status:
    get:
      summary: List redacted model configuration and test status by Agent role
      operationId: getModelRuntimeStatuses
      responses:
        "200":
          description: Model runtime status for target, attack, and defense Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelRuntimeStatus"
  /v1/runtime/audit-preflight/{agent_id}:
    get:
      summary: Check whether an Agent can start formal audit execution
      operationId: getAuditPreflight
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Tenant-scoped runtime readiness and blocking checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPreflightStatus"
  /v1/runtime/models/{role}/test:
    post:
      summary: Test and retain an ephemeral model configuration for one Agent role
      operationId: testModelRuntimeConfiguration
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [target, attack, defense]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRuntimeConfiguration"
      responses:
        "200":
          description: Redacted test result; credentials are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRuntimeStatus"
components:
  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
    AuditId:
      name: audit_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ProfileClaim:
      type: object
      required: [evidence_refs, confidence, verification_status]
      properties:
        evidence_refs:
          type: array
          minItems: 1
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        verification_status:
          type: string
          enum: [verified, supported, inferred, rejected]
    ProfileAnalysisStage:
      type: object
      required: [stage, status]
      properties:
        stage:
          type: string
          enum: [inventory, unpack, static_extract, framework_detect, graph_reconstruct, semantic_enrich, dynamic_verify, finalize]
        status:
          type: string
          enum: [pending, running, completed, failed, skipped]
        started_at:
          type: [string, "null"]
        completed_at:
          type: [string, "null"]
        checkpoint_ref:
          type: [string, "null"]
    ProfileAnalysisError:
      type: object
      required: [error_id, stage, code, message, retryable, details]
      properties:
        error_id:
          type: string
        stage:
          type: string
          enum: [inventory, unpack, static_extract, framework_detect, graph_reconstruct, semantic_enrich, dynamic_verify, finalize]
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties:
            type: [string, number, integer, boolean, "null"]
    ImageAnalysisStatus:
      type: object
      required: [schema_version, analysis_id, agent_id, image_digest, status, stages, errors]
      properties:
        schema_version:
          type: string
          const: image-analysis-status-v0.1
        analysis_id:
          type: string
        agent_id:
          type: string
        image_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        configuration_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Stable digest of profile-affecting Agent descriptor settings.
        status:
          type: string
          enum: [queued, running, completed, partial, failed]
        stages:
          type: array
          description: Ordered inventory, unpack, static_extract, framework_detect, graph_reconstruct, semantic_enrich, dynamic_verify, and finalize states.
          items:
            $ref: "#/components/schemas/ProfileAnalysisStage"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProfileAnalysisError"
    ImageProfileCreation:
      type: object
      required: [schema_version, analysis, cached]
      properties:
        schema_version:
          type: string
          const: image-profile-create-response-v0.1
        analysis:
          $ref: "#/components/schemas/ImageAnalysisStatus"
        cached:
          type: boolean
    ImageIdentity:
      allOf:
        - $ref: "#/components/schemas/ProfileClaim"
        - type: object
          required: [digest, os, architecture, entrypoint, command, working_directory, environment_variables, layer_digests]
          properties:
            digest:
              type: string
              pattern: "^sha256:[0-9a-f]{64}$"
            os:
              type: string
            architecture:
              type: string
            variant:
              type: [string, "null"]
            created_at:
              type: [string, "null"]
            entrypoint:
              type: array
              items:
                type: string
            command:
              type: array
              items:
                type: string
            working_directory:
              type: string
            environment_variables:
              type: array
              items:
                type: string
            layer_digests:
              type: array
              items:
                type: string
                pattern: "^sha256:[0-9a-f]{64}$"
    ProfileFramework:
      allOf:
        - $ref: "#/components/schemas/ProfileClaim"
        - type: object
          required: [framework_id, name]
          properties:
            framework_id:
              type: string
            name:
              type: string
            version:
              type: [string, "null"]
    ImageProfileNode:
      allOf:
        - $ref: "#/components/schemas/ProfileClaim"
        - type: object
          required: [node_id, node_type, name, framework_ids, capability_ids, permission_ids, control_ids, risk_level]
          properties:
            node_id:
              type: string
            node_type:
              type: string
              enum: [external_input, entrypoint, agent, sub_agent, llm, prompt, router, tool, rag, knowledge_base, memory, mcp, external_api, shell, file, browser, database, approval, guard]
            name:
              type: string
            framework_ids:
              type: array
              items:
                type: string
            capability_ids:
              type: array
              items:
                type: string
            permission_ids:
              type: array
              items:
                type: string
            control_ids:
              type: array
              items:
                type: string
            risk_level:
              type: string
              enum: [low, medium, high, critical]
    ImageProfileEdge:
      allOf:
        - $ref: "#/components/schemas/ProfileClaim"
        - type: object
          required: [edge_id, edge_type, source_node_id, target_node_id]
          properties:
            edge_id:
              type: string
            edge_type:
              type: string
              enum: [calls, routes_to, reads, writes, retrieves, invokes, controls, sends_to]
            source_node_id:
              type: string
            target_node_id:
              type: string
            condition:
              type: [string, "null"]
    ProfileCapability:
      allOf:
        - $ref: "#/components/schemas/ProfileClaim"
        - type: object
          required: [capability_id, name, operation, node_ids, risk_level]
          properties:
            capability_id:
              type: string
            name:
              type: string
            operation:
              type: string
            node_ids:
              type: array
              minItems: 1
              items:
                type: string
            risk_level:
              type: string
              enum: [low, medium, high, critical]
    ProfilePermission:
      allOf:
        - $ref: "#/components/schemas/ProfileClaim"
        - type: object
          required: [permission_id, permission_type, operations, scope, node_ids, capability_ids, risk_level]
          properties:
            permission_id:
              type: string
            permission_type:
              type: string
              enum: [network, file, database, shell, browser, external_api, credential]
            operations:
              type: array
              minItems: 1
              items:
                type: string
            scope:
              type: string
            node_ids:
              type: array
              minItems: 1
              items:
                type: string
            capability_ids:
              type: array
              items:
                type: string
            risk_level:
              type: string
              enum: [low, medium, high, critical]
    ProfileControl:
      allOf:
        - $ref: "#/components/schemas/ProfileClaim"
        - type: object
          required: [control_id, control_type, name, node_ids, description]
          properties:
            control_id:
              type: string
            control_type:
              type: string
              enum: [parameter_validation, allowlist, authorization, human_approval, input_guard, output_guard]
            name:
              type: string
            node_ids:
              type: array
              minItems: 1
              items:
                type: string
            description:
              type: string
    EvidenceLocator:
      type: object
      properties:
        image_path:
          type: [string, "null"]
        python_module:
          type: [string, "null"]
        symbol:
          type: [string, "null"]
        line_start:
          type: [integer, "null"]
          minimum: 1
        line_end:
          type: [integer, "null"]
          minimum: 1
        package_metadata_key:
          type: [string, "null"]
        config_key:
          type: [string, "null"]
        event_id:
          type: [string, "null"]
    ProfileEvidenceItem:
      type: object
      required: [evidence_id, artifact_digest, locator, extractor, method, trust_level, content_sha256]
      properties:
        evidence_id:
          type: string
        artifact_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        layer_digest:
          type: [string, "null"]
          pattern: "^sha256:[0-9a-f]{64}$"
        locator:
          $ref: "#/components/schemas/EvidenceLocator"
        extractor:
          type: string
        method:
          type: string
          enum: [image_config, package_metadata, static, framework, semantic, dynamic]
        trust_level:
          type: string
          enum: [static, attested, observed]
          description: Static extraction, image-provided attestation, or Sentinel-observed evidence.
        content_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        summary:
          type: [string, "null"]
    ProfileRiskPath:
      allOf:
        - $ref: "#/components/schemas/ProfileClaim"
        - type: object
          required: [path_id, source_node_id, sink_node_id, node_ids, edge_ids, capability_ids, permission_ids, control_ids, applicable_threats, control_gaps, risk_level]
          properties:
            path_id:
              type: string
            source_node_id:
              type: string
            sink_node_id:
              type: string
            node_ids:
              type: array
              minItems: 2
              items:
                type: string
            edge_ids:
              type: array
              minItems: 1
              items:
                type: string
            capability_ids:
              type: array
              items:
                type: string
            permission_ids:
              type: array
              items:
                type: string
            control_ids:
              type: array
              items:
                type: string
            applicable_threats:
              type: array
              minItems: 1
              items:
                type: string
            control_gaps:
              type: array
              items:
                type: string
            risk_level:
              type: string
              enum: [low, medium, high, critical]
    AnalysisLimitation:
      type: object
      required: [code, message, evidence_refs]
      properties:
        code:
          type: string
        message:
          type: string
        evidence_refs:
          type: array
          items:
            type: string
    CoverageStatistic:
      type: object
      required: [covered, total, ratio]
      properties:
        covered:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        ratio:
          type: number
          minimum: 0
          maximum: 1
    ProfileCompleteness:
      type: object
      required:
        - static_source_recovery
        - framework_coverage
        - graph_evidence_coverage
        - dynamic_corroboration_coverage
        - dynamic_behavior_coverage
        - unresolved_limitations
        - blocking_limitations
        - conclusion
      properties:
        static_source_recovery:
          type: string
          description: Recovery state for Python source code in the image.
          enum: [complete, partial, metadata_only, bytecode_only, none]
        framework_coverage:
          $ref: "#/components/schemas/CoverageStatistic"
        graph_evidence_coverage:
